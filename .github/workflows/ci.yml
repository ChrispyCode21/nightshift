# Quality gate for every PR and every push to main. "Checks" is a required status check on main.
# Actions are pinned to full commit SHAs (version in the comment); Dependabot keeps them current.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Plugin and marketplace manifests
        run: npx --yes @anthropic-ai/claude-code@2.1.12 plugin validate .
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in git ls-files '*.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Output "::error file=$file,line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Shell scripts (shellcheck)
        run: git ls-files '*.sh' 'bin/hooks/*' | xargs --no-run-if-empty shellcheck
